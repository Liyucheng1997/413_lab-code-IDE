<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' app:; script-src 'self' app: 'unsafe-eval'; style-src 'self' app: 'unsafe-inline'; img-src 'self' app: data: blob:; font-src 'self' app: data:; worker-src 'self' app: blob:; connect-src 'self' app:" />
    <title>Lumen IDE</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" data-name="vs/editor/editor.main" href="../../node_modules/monaco-editor/min/vs/editor/editor.main.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div id="app">
      <header id="titlebar">
        <div class="logo-mark">L</div>
        <nav id="menubar"></nav>
        <div class="titlebar-drag"></div>
        <button id="command-center" class="command-center" title="搜索文件、命令（Ctrl+P）">
          <span class="cc-icon" data-icon="search"></span>
          <span id="command-center-label">Lumen IDE</span>
        </button>
        <div class="titlebar-drag"></div>
        <div class="window-controls-space"></div>
      </header>

      <div id="workbench">
        <nav id="activitybar">
          <button class="activity" data-view="explorer" title="资源管理器 (Ctrl+Shift+E)" data-icon="files"></button>
          <button class="activity" data-view="search" title="搜索 (Ctrl+Shift+F)" data-icon="search"></button>
          <button class="activity" data-view="git" title="源代码管理 (Ctrl+Shift+G)" data-icon="git"><span class="badge" id="git-badge" hidden></span></button>
          <button class="activity" data-view="run" title="运行和调试 (Ctrl+Shift+D)" data-icon="bug"></button>
          <div class="activity-spacer"></div>
          <button class="activity" id="theme-toggle" title="切换主题" data-icon="moon"></button>
          <button class="activity" id="open-settings" title="设置 (Ctrl+,)" data-icon="gear"></button>
        </nav>

        <aside id="sidebar" class="card">
          <section class="view" data-view="explorer"></section>
          <section class="view" data-view="search" hidden></section>
          <section class="view" data-view="git" hidden></section>
          <section class="view" data-view="run" hidden></section>
        </aside>
        <div class="sash sash-v" id="sash-sidebar"></div>

        <main id="main">
          <section id="editor-area" class="card"></section>
          <div class="sash sash-h" id="sash-panel"></div>
          <section id="panel" class="card">
            <div class="panel-header">
              <div class="seg" id="panel-tabs">
                <button data-panel="terminal" class="active">终端</button>
                <button data-panel="problems">问题 <span class="count" id="problems-count">0</span></button>
                <button data-panel="output">输出</button>
                <button data-panel="debug">调试控制台</button>
              </div>
              <div class="panel-actions" id="panel-actions"></div>
            </div>
            <div class="panel-body">
              <div class="panel-view" data-panel="terminal"></div>
              <div class="panel-view" data-panel="problems" hidden></div>
              <div class="panel-view" data-panel="output" hidden></div>
              <div class="panel-view" data-panel="debug" hidden></div>
            </div>
          </section>
        </main>
      </div>

      <footer id="statusbar">
        <div class="sb-left" id="sb-left"></div>
        <div class="sb-right" id="sb-right"></div>
      </footer>
    </div>
    <div class="toast-host" id="toast-host"></div>

    <!-- xterm 必须在 Monaco 的 AMD 加载器之前加载，否则会被注册成 AMD 模块 -->
    <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="../../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
    <script src="../../node_modules/monaco-editor/min/vs/loader.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
